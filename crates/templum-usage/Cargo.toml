[package]
name = "templum-usage"
description = "What CLI agents tell about their sessions and plan limits, read from their own files. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Already in the tree: the agents' JSON and JSONL files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree (GPUI's): Codex's ISO timestamps and its sessions' dated folders.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
