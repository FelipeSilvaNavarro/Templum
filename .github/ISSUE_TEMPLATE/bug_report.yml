name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Templum version
      description: Release version, or commit hash if you built from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux (Wayland), Linux (X11), Windows]
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version and hardware
      placeholder: "e.g. macOS 15.4 on M2 · Arch / Hyprland · Windows 11 24H2"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots or recordings help a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
